# Backlog (fonte única) — itens pendentes e não-iniciados
#
# Um arquivo só, filtrável por `status`. O roadmap por fases continua no
# docs/PRD_MVP.md (fonte da verdade do *quando*); aqui é o estoque de itens com o
# *o quê/como*. Formato semi-estruturado: campos filtráveis + prosa no `detalhe`.
#
# CONVENÇÃO (herdada do projeto Karaoke, evoluída em 2026-07-09)
#   codigo      etiqueta estável [NI-##] — NÃO é posição. Item novo = próximo número
#               livre (não inserir no meio); ao remover/mover NÃO renumerar.
#   status      pendente      = defeito/limitação conhecido com correção já desenhada
#                               (o TODO real, intenção de fazer)
#               nao-iniciado  = ideia exploratória ou de fase futura, sem compromisso
#   prioridade  critica | alta | media | baixa  — importância/urgência, NÃO esforço.
#   rank        0=critica 1=alta 2=media 3=baixa — só pra ordenar por severidade.
#   esforco     P | M | G  (pequeno/médio/grande) — pra cruzar "alta + esforço baixo".
#   eixo        raspagem | enriquecimento | consulta | infra | distribuicao.
#   fase        fase do PRD em que o item se encaixa (0, 1, 2, dados) — "dados" é a
#               trilha de dados do PRD §6 (cinema, Instagram), paralela às fases.
#   depende_de / relacionado   listas de códigos NI-##.
#   caso_real   evidência concreta que motivou o item (evento/consulta real).
#
# CICLO DE VIDA: implementado de verdade → o item SAI deste arquivo (git preserva;
# o registro do que entrou no fluxo é o commit/spec correspondente). Testado e
# descartado → move pra rejeitado.yaml (mantendo o código).

# ─────────────────────────── Enriquecimento ───────────────────────────

- codigo: NI-01
  status: pendente
  prioridade: alta
  rank: 1
  esforco: M
  eixo: enriquecimento
  fase: 0
  titulo: "Dedupe intra-fonte (mesmo evento anunciado N vezes na mesma plataforma)"
  resumo: "o dedupe v1 só compara fontes diferentes; o Sympla tem o mesmo evento publicado por organizadores diferentes (casa + produtor) — estender com regra mais apertada que a cross-fonte"
  data: 2026-07-09
  depende_de: []
  relacionado: []
  caso_real: ["'DEU BENZA' 3x na Arena CCB em 11/07 (Pagode do Quadradinho / 'Organizador' / Benzadeus Produções)", "'Vem de pagode - Tá na medida + Kaique' x 'Kaique, Tá na Medida e DJ Kacá' — Brazolia, mesmo dia/hora", "'Samba de Chinelo' 2x na Estação Beira Lago, mesmo dia/hora"]
  detalhe: |
    Achado do dogfooding de 2026-07-09 (fim de semana 10–12/07). Em
    `src/enriquecer.py`, `_agrupar_duplicatas` exige `a["fonte"] != b["fonte"]`.

    **Correção desenhada:** permitir pares da mesma fonte com regra **mais apertada**
    que a cross-fonte (falso positivo intra-fonte é mais provável — edições/lotes
    diferentes do mesmo produtor): mesmo dia **e mesmo `local_cmp`** (não vazio) **e**
    similaridade de nome ≥ limiar a calibrar (~0.55), ou nome ≥ 0.85 com mesmo local.
    Manter cross-fonte como está. Calibrar contra os 3 casos reais (devem agrupar) e
    contra séries de eventos distintos do mesmo local (as festas semanais da LAH NÃO
    podem agrupar entre si). Testes em `tests/test_enriquecer.py`.

- codigo: NI-04
  status: nao-iniciado
  prioridade: media
  rank: 2
  esforco: M
  eixo: enriquecimento
  fase: 0
  titulo: "Ruído v2 — pegar curso/anúncio sem palavra-chave no nome"
  resumo: "a lista de termos v1 só vê o nome; curso com nome 'de fantasia' passa batido — sinais extras (duração multi-dia, horário diurno, local tipo centro de convenções) ou LLM"
  data: 2026-07-09
  depende_de: []
  relacionado: [NI-02, NI-03, NI-05]
  caso_real: ["'Do Chat GPT ao CLAUDE PRO' (curso de IA no Ulysses Centro de Convenções, sáb 8h30 da manhã, end_date 3 ANOS depois) — nenhuma palavra da lista no nome, passou pelo filtro"]
  detalhe: |
    O filtro v1 (palavra-chave no nome, fronteira de palavra) pegou 4/5 dos não-eventos
    da base atual, mas é cego a nome "de fantasia". O caso real acumula três sinais que
    o nome não mostra: começa 8h30 da manhã, dura "3 anos" (end_date 2029 — lixo de
    origem) e o local é centro de convenções.

    **Ideia (escada):** (a) heurísticas baratas — evento diurno que termina antes das
    18h, duração > 2 dias, local com "centro de convenções/auditório" no nome; cada uma
    marca com motivo próprio, mesma política conservadora; (b) quando a descrição
    existir (NI-02/NI-03), incluir a descrição no matching de termos; (c) LLM v2 (NI-05)
    decide "é vida noturna? sim/não" nos casos que as regras não alcançam.

- codigo: NI-05
  status: nao-iniciado
  prioridade: alta
  rank: 1
  esforco: G
  eixo: enriquecimento
  fase: dados
  titulo: "Classificação de gênero/vibe por LLM (enriquecimento v2)"
  resumo: "campo genero (pagode/funk/techno/sertanejo/eletrônica...) preenchido por Sonnet via subagente no Claude Code CLI na ingestão — decisões já travadas no PRD §3/§7"
  data: 2026-07-09
  depende_de: [NI-02, NI-06]
  relacionado: [NI-03, NI-04]
  caso_real: ["dogfooding 2026-07-09, busca 'eletrônico no fim de semana': só 3 eventos tinham o gênero no nome; Esquenta do Mantém e RECALL (after club) são eletrônicos e só foram classificados por conhecimento externo"]
  detalhe: |
    É o coração do moat (PRD §3): "festa de pagode/eletrônica" funcionar sem a palavra
    no nome. Decisões já travadas no PRD: modelo Sonnet (não Haiku — qualidade muito
    pior por economia irrisória), execução por subagente no Claude Code CLI
    (assinatura, não API paga), entrada em produção junto do Instagram (NI-06), que é
    quem fornece texto rico para classificar.

    **Ideia:** coluna genero (e talvez vibe/tags) preenchida na ingestão só para
    eventos novos/alterados; few-shot com os gêneros do recorte (pagode, samba, funk,
    sertanejo, eletrônica, rock, forró, brega); a consulta filtra por campo em vez de
    depender do FTS no nome. Medida de sucesso já definida no PRD §10: "festa de
    pagode" retornar pagodes SEM a palavra no nome.

