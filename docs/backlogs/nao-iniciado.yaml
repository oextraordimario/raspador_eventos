  caso_real: ["VÉRTICE - House 10 de Julho: a descrição diz 'cena eletrônica de Brasília', mas a busca por 'eletrônico' não acha o evento porque o nome não tem a palavra"]
  detalhe: |
    Sondado em 2026-07-09: a API de descoberta do Sympla não retorna descrição em campo
    nenhum (objeto completo conferido). A página do evento tem a descrição rica no
    estado Next.js (campo `detail`, HTML embutido), mas exige uma requisição por evento
    (~250) e o site recusa HTTP puro do urllib (loop de redirect) — via Playwright abre.
    No Ingresse a busca também não traz (chaves: title/place/session/poster/slug); a
    página/endpoint de evento individual ainda não foi sondada (o BFF tem /openapi.json).

    **Absorvido pela Etapa 5 da spec `docs/specs/20260709_mvp-fase-0/spec.md`**
    (revisão de 2026-07-09): sondar endpoint JSON individual antes de apelar pra HTML;
    raspagem incremental (só eventos sem descrição); ritmo educado. Quando a etapa
    rodar, este item sai da lista.

