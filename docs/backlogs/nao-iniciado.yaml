# NI-10 (cron da raspagem), NI-21 (LICENSE) e NI-28 (site público) foram
# IMPLEMENTADOS em 2026-07-26 (spec docs/specs/20260726_abrir-ao-publico/).
# NI-10: .github/workflows/raspar.yml roda o atualizar.py COMPLETO às 06:00 UTC
# (3h de Brasília), com Python+Node+Chromium no runner ubuntu — grátis e sem
# teto porque o repo é público. A extração de flyer do Instagram fica FORA do
# CI (caminho 1: `claude -p` roda na assinatura e não há login de assinatura em
# CI); daí as flags novas --sem-extracao-flyer (modo do cron, reporta
# pendentes_extracao) e --so-instagram (rodada local curta que processa a fila).
# Plano B registrado: Cloud Run Jobs, com 4 gatilhos objetivos no anexo cron.md.
# NI-21: MIT, copyright ZeroUm Soluções em Dados, + README para humanos.
# NI-28: front Next.js na RAIZ (app/, lib/) + api/dados.py como ponte para a
# consulta.py; filtros na URL (funciona sem JS, SSR indexável); sem imagens no
# v1; JSON-LD/sitemap/llms.txt junto (Porta B da Fase 2); postura de ToS
# "agregador com atribuição" virou código (descrição em trecho, organizador
# nunca exposto, página "sobre" com canal de remoção).
