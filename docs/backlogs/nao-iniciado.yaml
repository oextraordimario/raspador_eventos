# NI-54 (instrumentar o site) já estava IMPLEMENTADO quando a revisão da spec
# do rework do site foi conferir o código, em 2026-07-28 — e o item, escrito em
# 27/07, afirmava o contrário ("hoje NÃO existe analytics nenhum instalado") e
# propunha @vercel/analytics. A implementação real é OUTRA e é anterior ao
# próprio item: **PostHog**, no commit d796a90 (26/07). posthog-js no
# package.json + instrumentation-client.js (pageview, pageleave, exceptions,
# person_profiles identified_only), servido pelo PRÓPRIO DOMÍNIO via rewrites
# /ph/* no next.config.mjs — a defesa contra adblock, que precisa existir desde
# o início porque retrofitar invalida a série histórica. As envs
# NEXT_PUBLIC_POSTHOG_KEY/_HOST estão só em Production, o que resolve
# local × prod de graça. Quatro eventos custom já capturam: ticket_link_clicked,
# other_platform_link_clicked, film_session_clicked, event_search_performed.
# Consequências registradas: o NI-53 estava travado por uma dependência que já
# existia; o NI-50 tem com o que medir; e a spec do rework do site define, na
# §9, o evento de cada elemento novo — elemento novo nasce instrumentado.
# A lição fica: item de backlog escrito ANTES da última entrega precisa ser
# conferido no código antes de virar trabalho. O custo aqui teria sido instalar
# um segundo analytics em cima do primeiro.

# ────────────── Pipeline de dados (auditoria de 2026-07-27) ──────────────
# Origem: o autor questionou por que "mudar schema" implicava re-raspar, se a
# Bronze existe exatamente pra evitar isso. A auditoria confirmou: a convenção
# "base descartável" (spec 20260709_mvp-fase-0) é ANTERIOR à Bronze e nunca
# foi revista; o drop de 27/07 (NI-36/37) apagou o catálogo inteiro do Shotgun
# (fonte quebrada — irrecuperável por re-raspagem) e zerou `execucoes`. A
# convenção foi REESCRITA em 2026-07-27 (CLAUDE.md + sql/schema.sql +
# atualizar._checar_schema): aditivo = ALTER IF NOT EXISTS; não-aditivo =
# dropar só derivadas. Os dois itens abaixo fecham as lacunas restantes.

# NI-55 (prata 100% reconstruível) foi IMPLEMENTADO em 2026-07-28, na fatia 7 da
# spec docs/specs/20260728_arquitetura-medalhao/. A coleta parou de escrever em
# `tratado`: `normalizar()` das 5 fontes mudou para `tratamento/<fonte>.py` e lê
# `cru.<fonte>_atual`, então `--so-derivar` reconstrói a base inteira — colunas
# de identidade inclusive, que era o que faltava. Os quatro pontos de atenção que
# este item levantava foram todos endereçados, e dois deles com resposta
# diferente da prevista: (a) os rótulos externos (cidade_label, slug) viraram
# COLUNAS de cru.<fonte>, em vez de "deriváveis"; (b) `raspado_em` não vem do
# `raspado_em` do cru e sim de `visto_em`, coluna nova — no append-only o
# primeiro é data de MUDANÇA, e usá-lo marcaria como sumido todo evento que
# apenas não mudou; (c) o COALESCE do upsert foi REMOVIDO em vez de replicado
# (com a escrita inteira vindo do cru, preservar valor antigo esconderia bug de
# reconstrução); (d) parse e fetch estão em módulos separados, então importar o
# normalizador do Shotgun não arrasta mais o Playwright.
# A garantia agora é verificada, não prometida: tests/test_bronze.py apaga
# `tratado` e confere que o tratamento a reproduz (teste de fronteira, §10).

