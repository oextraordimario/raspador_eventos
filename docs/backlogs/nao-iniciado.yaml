  eixo: infra
  fase: 0
  titulo: "Prata 100% reconstruível — recriar `eventos` a partir do payload da Bronze"
  resumo: "derivar.py só recalcula colunas derivadas de linhas que JÁ existem; as colunas de catálogo (nome, data, url...) e a descrição nascem na raspagem e nunca são relidas da Bronze — enquanto isso for assim, mudança não-aditiva em eventos ainda força re-raspar"
  data: 2026-07-27
  depende_de: []
  relacionado: [NI-56, NI-15]
  caso_real: ["drop de 2026-07-27 (NI-36/37): sem caminho de re-normalização, a base foi reconstruída por re-raspagem — e o Shotgun, quebrado desde 17/07, foi apagado por inteiro (eventos + Bronze; ~49 futuros perdidos)"]
  detalhe: |
    O modelo já existe DENTRO do projeto: `aplicar_instagram` reconstrói os
    eventos fonte='instagram' 100% a partir de `instagram_raw`. Falta o
    equivalente para as 5 plataformas: reexecutar o `_normalizar` de cada
    scraper sobre o payload `catalogo` de `eventos_raw` (e reler a `descricao`
    do payload `detalhe`) — hoje essas funções só rodam na hora da raspagem.

    Pontos de atenção levantados na auditoria:
    - rótulos EXTERNOS ao payload (cidade_label do Shotgun/Ticket and Go) têm
      que ser deriváveis ou passar a ser gravados junto do raw;
    - `raspado_em` deve vir preservado do raw (é a âncora do `sumido`);
    - o upsert protege descrição via COALESCE — a re-normalização precisa da
      mesma semântica pra não regredir dado;
    - `_normalizar` importável sem efeito colateral (hoje mora nos scrapers,
      junto de código de rede — separar parse de fetch, ou importar com
      cuidado).

    Quando fechar: mudança não-aditiva vira "dropar derivadas + re-derivar",
    re-raspagem deixa de ser caminho de manutenção (fica só pra dado NOVO), e
    a regra (b) da convenção nova perde a ressalva sobre `eventos`.

