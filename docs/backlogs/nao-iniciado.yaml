# MCP remoto em produção na Vercel (streamable HTTP stateless sob prefixo de
# rota secreto MCP_SEGREDO, lendo a URL pooled do Neon; entrypoint api/index.py).
# Connector plugado no app do celular e validado pelo autor em 2026-07-11:
# consulta funcionando com o PC desligado — o critério da Fase 0b fechou.
# A reavaliação do banco (Turso e arquivo SQLite publicado rejeitados; Neon
# mantido) está registrada na spec — não reabrir sem fato novo.

# NI-11 (abrir o MCP ao público) foi IMPLEMENTADO em 2026-07-26, em duas
# etapas do mesmo dia: primeiro a instrumentação (tabelas usuarios + acessos,
# decorator @registrado nas 5 tools, teto de 120/hora e bloqueio reativo), e
# depois o OAuth, quando a conta WorkOS ficou de pé. src/auth.py verifica o JWT
# do AuthKit contra o JWKS; o connector virou PÚBLICO em
# https://raspador-eventos.vercel.app/mcp. Specs: 20260714_abrir-mcp-a-conhecidos
# (desenho) e 20260726_abrir-ao-publico passo 4 (o que mudou na execução).
# Pendências registradas na spec, não aqui: issuer ainda no Staging do WorkOS
# (troca é a env AUTHKIT_ISSUER) e MCP_SEGREDO só sai depois do fluxo rodar com
# gente de verdade. A decisão "cron ANTES de divulgar o link" segue de pé.
# Alternativa descartada (não reabrir sem fato novo): token por pessoa na URL —
# a spec de authorization do MCP proíbe access token em query string.

- codigo: NI-29
  status: pendente
  prioridade: alta
  rank: 1
  esforco: P
  eixo: distribuicao
  fase: 1
  titulo: "Validar o fluxo OAuth do MCP de ponta a ponta — nenhum login concluiu ainda"
  resumo: "o OAuth está no ar e recusa acesso corretamente, mas ninguém completou o login; até alguém completar, não se sabe se o token que o AuthKit emite é aceito — e o connector remoto fica inutilizável"
  data: 2026-07-26
  depende_de: []
  relacionado: [NI-10, NI-11]
  caso_real: ["autor tentou refazer o connector em 2026-07-26 e o claude.ai travou no meio do fluxo; a tela do AuthKit pedia criar conta com senha (corrigido no mesmo dia: senha desligada, só login social)"]
  detalhe: |
    **Estado em 2026-07-26.** O que está PROVADO: o metadado da RFC 9728 responde
    200 em /.well-known/oauth-protected-resource/mcp, POST /mcp sem token dá 401
    com o WWW-Authenticate correto, token inválido é recusado, e o AuthKit publica
    registration_endpoint + JWKS. O que NÃO está provado: que um token de verdade
    passa. `usuarios` está VAZIA e todo acesso em `acessos` tem sub NULL.

    O trecho não testado é pequeno mas é o que importa — a verificação em
    `src/auth.py`. O suspeito nº 1 é o `aud`: validamos contra MCP_RECURSO, e se o
    AuthKit puser outra coisa no claim o token cai em 401 silencioso. O motivo real
    fica no log da função na Vercel (`[auth] token recusado: ...`); o cliente MCP só
    mostra "unauthorized". Olhar lá ANTES de mexer no código.

    Enquanto isso o MCP remoto está inutilizável na prática (o caminho antigo com
    MCP_SEGREDO deixou de existir e o connector velho ficou em loop de 404 — apagar
    e recriar, não editar: o cliente guarda estado de autorização por connector).
    O stdio local segue funcionando e mascara o problema: chamada pelo Claude
    Desktop responde normal, porque roda na máquina do autor e não autentica nada.

    Bloqueia divulgar o link, junto com o cron (decisão travada na spec do NI-11 §10).

    Pontas soltas que aparecem quando isso destravar:
    - **Issuer ainda no Staging do WorkOS.** Trocar para Production é a env
      AUTHKIT_ISSUER, mas exige ativar Production no painel E configurar
      credenciais próprias de login social (Google Cloud etc.) — o Staging usa as
      credenciais emprestadas do WorkOS, o Production não. `connectionsByType`
      volta vazio nos dois. Ao trocar, todo mundo re-autentica: `sub` é por ambiente.
    - **MCP_SEGREDO e a rewrite `/:segredo/mcp`** só saem depois disso rodar —
      hoje são o rollback sem tocar em código.

    Alternativa se o atrito do login se provar proibitivo (é reabrir decisão
    travada, não configuração): MCP aberto sem token. Custo — some o teto por
    pessoa (sobra teto global, que um laço automático consome sozinho, com o free
    tier do Neon atrás) e some a evidência de uso de terceiro que o PRD §10 exige
    para fechar a Fase 1.

- codigo: NI-30
  status: pendente
  prioridade: media
  rank: 2
  esforco: M
  eixo: infra
  fase: dados
  titulo: "Extração do flyer do Instagram não tem automação — a fila só anda com rodada local"
  resumo: "o cron (NI-10) roda com --sem-extracao-flyer porque o `claude -p` usa a ASSINATURA e não há login de assinatura em CI; a fila de posts sem extração cresce sozinha até alguém rodar --so-instagram na mão"
  data: 2026-07-26
  depende_de: [NI-10]
  relacionado: [NI-24]
  caso_real: ["em 2026-07-26, mesmo depois de uma rodada --so-instagram às 12:37, 40 shortcodes seguiam sem extração na Bronze"]
  detalhe: |
    É o buraco conhecido do "caminho 1" (spec 20260726_abrir-ao-publico §3 passo 2):
    tudo menos a visão do flyer roda no cron. A ingestão é automática — o post
    entra na Bronze na rodada do Actions —, mas o post SÓ VIRA EVENTO depois da
    extração, que exige `claude -p` logado na assinatura. Em CI não existe esse
    login (o subprocesso remove ANTHROPIC_API_KEY de propósito, senão a chave
    teria precedência e viraria custo de API).

    Consequência prática: casa que só divulga no Insta fica invisível no site e
    no MCP até o autor lembrar de rodar `python src/atualizar.py --so-instagram`.
    Quanto mais o site for usado, mais isso pesa — e o modo de falha é silencioso:
    a fila cresce, ninguém vê erro, o evento simplesmente não aparece.

    O relatório da rodada já informa o tamanho da fila; falta o passo de agir.
    Caminhos possíveis, do mais barato ao mais caro:
    - runner self-hosted do Actions na máquina do autor (herda o login da
      assinatura; troca automação por a máquina precisar estar ligada);
    - aceitar custo de API só para esse passo (usar ANTHROPIC_API_KEY no CI) —
      quebra a premissa de custo zero, mas é o único caminho 100% automático.
      Dimensionar: é 1 chamada de visão por post NOVO, não por rodada;
    - notificação quando a fila passar de N, transformando o problema de
      "lembrar" em "reagir" — não automatiza, mas tira do esquecimento.

    Decidir só com número na mão: medir por quantos dias a fila fica parada e
    quantos eventos deixaram de existir por causa disso.

