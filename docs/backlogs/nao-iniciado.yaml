- codigo: NI-21
  status: em-andamento
  prioridade: media
  rank: 2
  esforco: P
  eixo: infra
  fase: 0
  titulo: "Escolher e adicionar LICENSE ao repo público"
  resumo: "o repo ficou público sem licença = 'todos os direitos reservados' (ninguém pode legalmente usar o código); decidir a licença com calma e criar o arquivo LICENSE na raiz"
  data: 2026-07-11
  depende_de: []
  relacionado: []
  caso_real: ["revisão de segurança pré-publicação (2026-07-11): repo aprovado para abrir, mas sem LICENSE"]
  detalhe: |
    Sem arquivo LICENSE, repo público é só vitrine: juridicamente ninguém pode
    usar/copiar/modificar. Mecânica trivial: arquivo `LICENSE` (sem extensão) na
    raiz com o texto integral da licença; o GitHub detecta e exibe na sidebar.

    **Opções mapeadas** (do mais ao menos permissivo): MIT (padrão de facto p/
    projeto pessoal/PoC — uso livre mantendo o aviso de copyright), Apache 2.0
    (idem + cláusula de patentes, mais corporativa), GPL-3.0 (copyleft: quem
    distribui derivado é obrigado a abrir o código). Template preenchível em
    https://choosealicense.com — trocar [year]/[fullname] e salvar; a interface
    web do GitHub também oferece seletor de template ao criar o arquivo.

    **Nota:** a licença cobre o CÓDIGO, não os dados raspados — os payloads das
    plataformas (Sympla/Ingresse/etc.) não são nossos para licenciar, e não
    precisam de cláusula especial numa PoC.

- codigo: NI-11
  status: em-andamento
  prioridade: media
  rank: 2
  esforco: M
  eixo: distribuicao
  fase: 1
  titulo: "Abrir o MCP remoto ao público, com OAuth + instrumentação de uso"
  resumo: "transformar o MCP remoto de uso próprio (NI-20) em connector público com login/consentimento (OAuth via provedor gerenciado) e registro de quem/quando consultou — sem medição o critério da Fase 1 ('um conhecido usa') não fecha"
  data: 2026-07-09
  depende_de: [NI-20]
  relacionado: [NI-10]
  caso_real: []
  detalhe: |
    PRD §6 Fase 1: porta A pública. Reescopado em 2026-07-10: o MCP remoto em si
    virou NI-20 (Fase 0b, uso próprio); o que resta aqui é a abertura a terceiros —
    auth adequada (o token único de uso próprio não distingue pessoas) e
    instrumentação. Instrumentação é requisito, não enfeite (PRD §10): o critério de
    fase só fecha com uso de terceiro comprovado por registro.

    **SPEC APROVADA (2026-07-14): docs/specs/20260714_abrir-mcp-a-conhecidos/**
    (com anexo `pesquisa-clientes-mcp.md`). Desenho: a URL do connector vira
    PÚBLICA (https://raspador-eventos.vercel.app/mcp) e o controle vai para o
    login — OAuth com Dynamic Client Registration, servidor de autorização
    gerenciado (WorkOS AuthKit; Auth0 de fallback). O SDK mcp (1.10.1) já é
    Resource Server: 401 + WWW-Authenticate, /.well-known/oauth-protected-resource
    e validação do token vêm prontos; escrevemos só o TokenVerifier (JWKS).
    Tabelas novas `usuarios` + `acessos`; landing page estática com o passo a
    passo; MCP_SEGREDO morre.

    Decisões confirmadas pelo autor na revisão: acesso ABERTO a quem logar (sem
    allowlist; controle reativo por teto + bloqueio), guardar e-mail/nome do
    login (com aviso na landing) e NI-10 (cron) ANTES de divulgar o link — base
    parada vira resposta errada com cara de certa para quem não é o autor.

    Alternativa descartada (não reabrir sem fato novo): token por pessoa na URL.
    A Anthropic desaconselha credencial na URL do connector e a spec de
    authorization do MCP proíbe access token em query string — ver spec §0.

