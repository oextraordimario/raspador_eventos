- codigo: NI-27
  status: nao-iniciado
  prioridade: media
  rank: 2
  esforco: G
  eixo: raspagem
  fase: 0
  titulo: "Novas fontes de ingresso a avaliar/raspar (Bilheteria Digital, Meaple, Viagogo...)"
  resumo: "backlog ACUMULATIVO de plataformas de ingresso candidatas a virar scraper; cada uma passa pelo mesmo crivo do NI-22 (tem API JSON aberta? dá pra filtrar DF?) antes de valer o esforço — anexar candidata nova aqui, não abrir NI por site"
  data: 2026-07-23
  depende_de: []
  relacionado: [NI-22, NI-15]
  caso_real: []
  candidatas:
    - url: https://www.bilheteriadigital.com/
      nota: "plataforma nacional; recon da API de descoberta + filtro por Brasília/DF"
    - url: https://meaple.com.br/
      nota: "plataforma de ingressos; recon do catálogo + endpoint de busca"
    - url: https://www.viagogo.com/
      nota: "MARKETPLACE DE REVENDA e GLOBAL — natureza de dado diferente (preço de revenda, não o da casa); avaliar se cabe no escopo DF/vida noturna antes de investir, e anti-bot forte esperado"
  detalhe: |
    Estoque de fontes de ingresso candidatas a entrar no fluxo. NÃO é compromisso de
    raspar todas — cada uma passa pelo mesmo funil do NI-22 (Zig/Ticket and Go):

    (1) **spike de reconhecimento** — tem API JSON aberta (sem navegador, sem auth)?
        O site rende catálogo paginável? (`src/scrapers/discover_sympla.py` é o modelo
        de interceptação de XHR/fetch quando não há API óbvia.)
    (2) **filtro DF** — dá pra recortar Brasília/DF, server-side ou textual (como o
        `_do_df` do Ticket and Go)? Se o recorte DF for vazio, não vale o scraper.
    (3) **normalizar** — só então `_normalizar(...) → dict` no schema unificado +
        passo no `atualizar.py`. Playwright só se HTTP puro for bloqueado (caso
        Shotgun/429).

    **Candidatas semeadas** (2026-07-23, pelo autor) no campo `candidatas` acima.
    Ressalva do Viagogo: revenda e global — preço não é o da casa e o escopo DF
    precisa ser filtrado com cuidado; pode não caber na PoC. As páginas de Instagram
    dessas casas entram por outro caminho — a watchlist `dados/perfis_instagram.yaml`
    (NI-06/NI-24), não aqui.

- codigo: NI-15
  status: nao-iniciado
  prioridade: media
  rank: 2
  esforco: M
  eixo: raspagem
  fase: 0
  titulo: "Salvaguarda: refresh incremental (não re-raspar evento já conhecido por inteiro)"
  resumo: "checar estratégia de, para evento que já existe na base, re-raspar só os campos voláteis (lote/preço/esgotado) em vez do payload inteiro — economiza tempo/carga, sobretudo no Shotgun (Playwright)"
  data: 2026-07-10
  depende_de: []
  relacionado: [NI-12, NI-10]
  caso_real: []
  detalhe: |
    Hoje o UPSERT (chave `<fonte>:<id_nativo>`) já evita duplicar, mas o pipeline
    ainda raspa e reescreve TUDO a cada rodada. Campos estáveis (nome, data, local)
    quase nunca mudam; o que muda com frequência é preço/lote/lotação. O Shotgun é o
    caso caro (navegador por evento) — revisitar cada página toda vez não escala p/ a
    automação diária (NI-10).

    **A checar:** (a) o catálogo/listagem já dá pra decidir "novo vs. conhecido" antes
    de abrir a página de detalhe? (b) faz sentido um TTL por campo — detalhe pesado
    (descrição) raspado 1x, voláteis (preço) revalidados a cada rodada? (c) o COALESCE
    do upsert (que hoje protege a descrição de ser zerada) já é meio-caminho — formalizar.
    Cuidado com corretude: evento pode ser DESmarcado/adiado; não pode ficar preso a
    dado velho só por já existir. Medir o ganho antes de complicar o `atualizar.py`.

