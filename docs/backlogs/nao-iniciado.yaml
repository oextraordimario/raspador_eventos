  resumo: "o scraper roda sem erro e extrai ZERO eventos desde 2026-07-17; o site perdeu a fonte inteira e ninguém percebeu por 9 dias, porque não havia rodada recorrente para comparar"
  data: 2026-07-26
  depende_de: []
  relacionado: [NI-32, NI-10]
  caso_real: ["rodada do cron 2026-07-26T15:34 (Actions run 30208493685): '[shotgun] pagina 1: +0 slugs ineditos | 0 eventos encontrados em brasilia'; ALERTA no relatório: coleta caiu 100% (77 → 0)"]
  detalhe: |
    **Não é falha de ambiente.** No run do Actions o Chromium instalou, o
    Playwright subiu e a página foi aberta — o scraper simplesmente não extraiu
    slug nenhum:

        [shotgun] raspando...
          pagina 1: +0 slugs ineditos | acumulado: 0
          0 eventos encontrados em 'brasilia'
          0 eventos futuros normalizados

    Última coleta boa: 2026-07-17T10:56 (77 eventos). Ou seja, a fonte está
    morta há mais de uma semana e só apareceu agora, porque o relatório
    comparativo precisa de DUAS rodadas seguidas para acusar — e antes do cron
    isso nunca acontecia de forma confiável.

    **Hipótese principal:** o Shotgun mudou a listagem de cidade. O CLAUDE.md já
    registra que essa fonte é a mais frágil (HTTP puro dá 429, tudo depende do
    render RSC) e que a regex tem de casar link RELATIVO `/events/<slug>`. Os
    candidatos, em ordem: (a) a rota `/pt/cities/<slug>?page=N` mudou; (b) o
    HTML deixou de trazer os links no primeiro render (virou fetch posterior);
    (c) a regex de slug parou de casar por mudança de formato.

    **Como investigar:** abrir a listagem com o Playwright em modo visível e
    olhar o que volta, antes de mexer em regex. Se a página mudou de estrutura,
    `src/scrapers/discover_sympla.py` é o modelo de ferramenta de reconhecimento
    (intercepta XHR/fetch) — vale o equivalente aqui.

    **Impacto medido em 2026-07-26:** ZERO eventos futuros do Shotgun visíveis
    na consulta (eram 46). Não é só dado velho — é fonte inteira fora do ar, com
    o site já público. Ver NI-32: o desaparecimento foi causado pela guarda do
    `sumido`, não pelo scraper.

- codigo: NI-32
  status: pendente
  prioridade: alta
  rank: 1
  esforco: P
  eixo: raspagem
  fase: 0
  titulo: "Guarda do `sumido` confia em 'não levantou exceção' — fonte que volta ZERO apaga o próprio catálogo"
  resumo: "_marcar_sumidos pula fonte com erro, mas fonte que devolve lista vazia sem exceção passa na guarda e faz TODOS os futuros dela virarem sumido=1 numa rodada"
  data: 2026-07-26
  depende_de: []
  relacionado: [NI-31]
  caso_real: ["rodada 2026-07-26T15:34: Shotgun devolveu 0 eventos sem erro; 46 dos 49 futuros da fonte foram marcados sumido=1 e sumiram do site na mesma rodada"]
  detalhe: |
    `atualizar.py:130` pula a fonte quando `"erro" in res`. A intenção está certa
    e documentada ("um 500 do Sympla não pode esconder a agenda inteira"), mas o
    critério é frágil: scraper que RODA e devolve lista vazia não tem "erro". Aí
    todo evento futuro da fonte fica com `raspado_em` anterior ao início da
    rodada e é marcado `sumido = 1` — que é exatamente o que a consulta esconde.

    O resultado é o pior dos dois mundos: a fonte quebra em silêncio e, na
    primeira rodada seguinte, o catálogo dela some do site como se cada evento
    tivesse sido cancelado. Foi o que aconteceu com o Shotgun (NI-31).

    **A informação para evitar isso JÁ EXISTE e não é usada.** O relatório de
    saúde da mesma rodada acusou "coleta caiu 100% (77 → 0) — scraper quebrado?".
    Detectamos e mesmo assim apagamos. Falta ligar um no outro.

    Correção desenhada: tratar coleta VAZIA (ou queda abrupta além de um limiar)
    como fonte não confiável e pular a marcação, do mesmo jeito que se pula
    fonte com erro. Zero coletado num catálogo que tinha 77 não é "todos os
    eventos foram cancelados" — é ausência de informação, e ausência de
    informação não deve apagar dado bom.

    Como é idempotente, a recuperação é automática: reconsertado o scraper, o
    upsert atualiza `raspado_em` e a própria função desmarca. Mas até lá o site
    mente por omissão — e agora ele é público.

    Vale um teste em tests/test_observabilidade.py travando o caso: fonte que
    devolve [] sem erro NÃO pode marcar sumido.

