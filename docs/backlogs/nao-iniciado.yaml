- codigo: NI-45
  status: pendente
  prioridade: media
  rank: 2
  esforco: M
  eixo: consulta
  fase: 1
  titulo: "Filtro por bairro"
  resumo: "PARCIAL desde 28/07: o dicionário de regiões, a canonização de grafia, a faceta e o dropdown estão no ar, e a cobertura foi de 23% para 56% dos futuros visíveis. O teto é estrutural: Ticket and Go e Instagram (112 de 379) não expõem endereço NENHUM, e nenhum dicionário resolve isso — a saída é o NI-16 (bairro canônico da casa)"
  data: 2026-07-27
  atualizado: 2026-07-28
  depende_de: []
  relacionado: [NI-16, NI-46]
  caso_real: ["beta com amigos (2026-07-27): 'filtro por bairro / proximidade (ex: bairro do amigo)'"]
  detalhe: |
    TRÊS partes, remedidas em 2026-07-28 (a spec foi revista junto):
    (a) SHOTGUN — o `addressLocality` do JSON-LD é o bairro e hoje só vai para
    `endereco`; mapeá-lo também para `bairro` é UMA LINHA em
    `tratamento/shotgun.py` e leva a cobertura de 23% para ~41%. Melhor razão
    custo/benefício do item inteiro, e não estava separado antes.
    (b) DICIONÁRIO textual das RAs sobre `endereco` (Brasília ajuda: Asa
    Norte/Sul, SCLS, Taguatinga...), que hoje só ajuda o SYMPLA — o Ticket and
    Go PAROU de expor endereço quando a V1 foi desligada (NI-57), então a
    premissa original do item ("endereco_completo textual") não vale mais.
    Derivação a seco; `--so-derivar` resolve sem re-raspar. ATENÇÃO: roda
    dentro de `comum.aplicar()`, não no `enriquecer` — `bairro` já tem um
    escritor, e dois escritores na mesma coluna é o bug que a arquitetura
    medalhão desmontou.
    (c) EXPOSIÇÃO — faceta de bairros com evento futuro + parâmetro `bairro`
    em `buscar_eventos` + dropdown no site (a tool MCP herda de graça).
    Teto: Ticket and Go + Instagram = 112 dos 379 futuros sem endereço; para
    eles só o NI-16 (bairro canônico da casa em `curado.locais`) resolve.
    Spec: docs/specs/20260728_rework-site/.

    ESTADO EM 2026-07-28 (as três partes feitas; o que resta é o teto):
    (a) feito — e o achado foi maior que a previsão: o normalizador fazia
        `endereco = addressLocality or streetAddress`, e como a fonte quase
        sempre preenche o primeiro, o streetAddress (endereço COMPLETO, em 68
        dos 70 payloads) era descartado. Além disso, 38 dos 70 addressLocality
        dizem "Brasília" — a cidade, não o bairro. Corrigido: bairro só quando
        difere da cidade; endereço = streetAddress. Deu +32 bairros, não +68.
    (b) feito — `tratamento/bairros.py`, dentro de `comum._tratar`. Cobre RAs,
        setores por extenso e siglas do Plano Piloto (CLS/SHCS/SCES→Asa Sul,
        SQN/CLN→Asa Norte, SAAN/SIA/SIG como área própria). Ganhou de brinde o
        `canonizar()`: a base tinha "Asa Norte", "ASA NORTE" e "asa norte" como
        três bairros, além de "Saan"/"SAAN" e "Samambaia sul"/"Samambaia
        Norte". Passaram de 44 grafias para 32 regiões.
    (c) feito — faceta ordenada por QUANTIDADE (numa lista de 32, a região com
        84 festas tem que estar no topo, não em "Á"), parâmetro `bairro` multi
        na consulta/API/MCP, dropdown no padrão do cinema.
    Resultado: 23% → 56% dos futuros visíveis. O que falta é o teto estrutural
    — e ele é NI-16, não mais dicionário.

