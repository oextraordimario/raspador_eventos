# NI-57 (Ticket and Go pela API V2) e NI-59 (coleta zerada não marca sumido)
# foram IMPLEMENTADOS em 2026-07-28, no mesmo dia em que entraram — spec
# docs/specs/20260728_fontes-quebradas/. NI-57: a V1 foi desligada; listagem
# passou para /api/v2/site/list/all e o detalhe para /eventos/{slug}/evento
# (que ainda traz o id numérico, então a chave ticketandgo:<id> sobreviveu e a
# base atualizou em vez de duplicar). Como a fonte parou de expor endereço, o
# recorte DF virou três sinais — local em dados/locais_df.yaml, termo
# inequívoco, CEP 70-73/DF na descrição — medidos em 77/77 contra os eventos
# que a base tinha da era com endereço. A estratégia planejada na spec (buscar
# por termos no filter= da V2) foi REPROVADA por medição (1% de recall) e o
# desvio está registrado na §7 da spec. NI-59: guarda de duas linhas no
# _marcar_sumidos + o alerta dizendo o que o sistema fez; teste em
# tests/test_observabilidade.py trava os dois lados (zero pula, coleta real
# continua marcando).
#
# NI-58 (Shotgun em 0 no CI) foi RESOLVIDO POR DECISÃO em 2026-07-28, sem
# investigar o bloqueio: a fonte saiu do cron (--sem-shotgun fixo no workflow,
# que também parou de instalar o Chromium) e passou a rodar na
# `--rodada-local`, que já era obrigatória pela extração de flyer. O raciocínio
# do autor foi de proporção, não de curiosidade: descobrir SE é challenge, geo
# ou fingerprint custaria rodadas de CI de 12 min cada, e a correção mais
# provável (proxy residencial) custaria dinheiro recorrente — por ~65 eventos
# por semana de uma fonte que funciona de graça na máquina dele. Preço aceito e
# consciente: a agenda do Shotgun fica tão fresca quanto a frequência da rodada
# local. Se um dia a fonte crescer ou o dono quiser o cron completo, a
# instrumentação (exceção + HTML/screenshot em diagnostico/shotgun/) continua
