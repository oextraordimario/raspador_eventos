  titulo: "Ruído v2 — pegar curso/anúncio sem palavra-chave no nome"
  resumo: "a lista de termos v1 só vê o nome; curso com nome 'de fantasia' passa batido — sinais extras (categoria real, duração, horário diurno, local) ou LLM"
  data: 2026-07-09
  depende_de: []
  relacionado: [NI-05]
  caso_real: ["'Do Chat GPT ao CLAUDE PRO' (curso de IA no Ulysses Centro de Convenções, sáb 8h30 da manhã, end_date 3 ANOS depois)", "'Atualização em Nódulos de Tireoide' (curso médico)", "'Open AA' (grupo de apoio)", "'VIP TÉCNICO BCF 2026'", "'Destravando sua Timidez'"]
  detalhe: |
    O filtro v1 (palavra-chave no nome, fronteira de palavra) pega o grosso, mas é
    cego a nome "de fantasia". Os casos reais acumulam sinais que o nome não mostra:
    horário diurno, duração absurda (end_date 2029), local tipo centro de convenções.

    **Sinal novo desde a Etapa 5:** a coluna `categoria` do Sympla agora tem a
    categoria real do BFF (`musica`, `desenvolvimento-pessoal`, `saude-nutricao...`).
    CUIDADO: é escolhida pelo organizador e mente ("Beatles Abbey Road Tribute" está
    em `curso-workshop`, "BAILÃO DO VILLA" em `erotico-adulto-explicito`) — não pode
    ser regra sozinha, mas serve como sinal composto.

    **Ideia (escada):** (a) heurísticas baratas combinadas — categoria não-música E
    (diurno OU duração > 2 dias OU local "centro de convenções/auditório"); cada
    regra marca com motivo próprio, mesma política conservadora; (b) incluir a
    descrição (agora existente) no matching de termos; (c) LLM v2 (NI-05) decide
    "é vida noturna? sim/não" nos casos que as regras não alcançam.

- codigo: NI-05
  status: nao-iniciado
  prioridade: alta
  rank: 1
  esforco: G
  eixo: enriquecimento
  fase: dados
  titulo: "Classificação de gênero/vibe por LLM (enriquecimento v2)"
  resumo: "campo genero (pagode/funk/techno/sertanejo/eletrônica...) preenchido por Sonnet via subagente no Claude Code CLI na ingestão — decisões já travadas no PRD §3/§7"
  data: 2026-07-09
  depende_de: [NI-06]
  relacionado: [NI-04]
  caso_real: ["dogfooding 2026-07-09, busca 'eletrônico no fim de semana': só 3 eventos tinham o gênero no nome; Esquenta do Mantém e RECALL (after club) são eletrônicos e só foram classificados por conhecimento externo", "typo na origem: a descrição do VÉRTICE - House diz 'cena elentronica de Brasília' — keyword matching quebra com texto sujo, LLM não"]
  detalhe: |
    É o coração do moat (PRD §3): "festa de pagode/eletrônica" funcionar sem a palavra
    no nome. Decisões já travadas no PRD: modelo Sonnet (não Haiku — qualidade muito
    pior por economia irrisória), execução por subagente no Claude Code CLI
    (assinatura, não API paga), entrada em produção junto do Instagram (NI-06), que é
    quem fornece texto rico para classificar. Desde a Etapa 5 a base já tem descrição
    (94–100% por fonte), atrações e categoria real — insumo local já disponível antes
    mesmo do Instagram.

    **Ideia:** coluna genero (e talvez vibe/tags) preenchida na ingestão só para
    eventos novos/alterados; few-shot com os gêneros do recorte (pagode, samba, funk,
    sertanejo, eletrônica, rock, forró, brega); a consulta filtra por campo em vez de
    depender do FTS no nome. Medida de sucesso já definida no PRD §10: "festa de
    pagode" retornar pagodes SEM a palavra no nome.

    **Nota (2026-07-23): DESTRAVADO** — o NI-06 foi implementado (spec
    20260723_instagram-como-fonte): a base já recebe legenda + extração do flyer
    (descricao/atracoes dos eventos fonte='instagram'), e o executor por
    subagente (`claude -p` na assinatura) estreou na extração do flyer — o
    mesmo caminho serve a este classificador. É o próximo candidato natural.

