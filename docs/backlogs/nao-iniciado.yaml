  data: 2026-07-10
  depende_de: []
  relacionado: [NI-13]
  caso_real: ["dogfooding 2026-07-10, teste do MCP: 'VÉRTICE - House 10/07' (Sympla) veio com preco_min=null; ao tentar o valor na página, o Sympla joga numa fila anti-bot (queue-it) — o raspador não alcança o preço por HTTP simples"]
  detalhe: |
    Achado no teste do MCP em 2026-07-10 (fim de semana 10–12/07). Regressão de
    escopo da Etapa 5: `_preco_min` existe só em `src/scrapers/shotgun.py` (lê
    `offers.lowPrice/price` do JSON-LD). O `raspar_descricao` do Sympla
    (`event-page.svc`) devolve só descricao+categoria; o do Ingresse (`GET /events/
    {slug}`) idem. Nenhum dos dois popula `preco_min`.

    **Complicação (Sympla):** a página pública redireciona pra sala de espera
    anti-bot (queue-it) sob pico — HTTP puro não passa. Investigar se o BFF de
    catálogo (`discovery-bff/search`) ou o de página (`event-page.svc`) traz preço/
    lote no JSON (o valor mais barato costuma vir no payload da API, sem passar pela
    fila). Ingresse: checar `offers`/preço no `GET /events/{slug}` e no search.

    **Correção desenhada:** achar o campo de preço no payload JSON de cada BFF
    (Sympla e Ingresse) e mapear pro `preco_min` já existente no schema — mesmo
    caminho que o Shotgun. Gratuito vs. esgotado vs. sem-informação precisam ser
    distinguíveis (0 ≠ null). Sem re-raspar não resolve (é dado de origem).

