  relacionado: [NI-05]
  caso_real: ["a lista de 27/07 tinha 3 dos 4 primeiros eventos com data repetida no título, consumindo as duas linhas do card"]
  detalhe: |
    Implementado em 2026-07-27 como `tituloLimpo()` em `lib/formato.js`, usado
    pelo card, pelo <h1>, pelo <title> e pelo JSON-LD. A regra é conservadora
    de propósito: só remove um trecho de data quando ele está ISOLADO por
    separador (|, –, -, ·), o que preserva "Rock dos 80/90", "Baile 24/7" e
    "Aniversário 10/10 anos". Casos verificados à mão antes de subir.

    **A dívida:** o lugar certo é `derivar.py`, junto das outras colunas da
    camada Prata. O nome limpo é enriquecimento de DADO, não de apresentação —
    quem consulta pelo MCP merece o mesmo título que quem abre o site, e hoje
    não recebe. Ficou no front para não misturar mudança de base com mudança
    visual na mesma leva.

    Ao migrar: o original continua preservado em `eventos_raw` (Bronze), então
    sobrescrever `eventos.nome` na derivação é reversível por `--so-derivar` —
    é exatamente o padrão das outras colunas derivadas. Portar os casos de
    teste junto; a regra em JS e a em Python precisam concordar, ou o site e o
    agente passam a divergir no nome do mesmo evento.

