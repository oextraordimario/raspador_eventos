- codigo: NI-13
  status: pendente
  prioridade: critica
  rank: 0
  esforco: P
  eixo: consulta
  fase: 0
  titulo: "Descrição completa não chega ao agente (consulta trunca em 300 chars)"
  resumo: "o texto inteiro está na base, mas buscar_eventos devolve só substr(descricao,1,300); o agente não consegue detalhar um evento sob demanda — falta o 'do que se trata' completo"
  data: 2026-07-10
  depende_de: []
  relacionado: [NI-12]
  caso_real: ["dogfooding 2026-07-10, teste do MCP: pedido 'traz a descrição dessa Vértice' — a tool cortou em '...Programação: Abertura 22h 22h A', sem o line-up nem os detalhes que vinham depois"]
  detalhe: |
    NÃO é bug de raspagem: `descricao` completa já está gravada (Etapa 5, cobertura
    94–100% por fonte). É decisão de `src/consulta.py`: `DESCRICAO_MAX = 300` e
    `substr(e.descricao, 1, 300) AS descricao`, feita de propósito pra não encher o
    contexto do agente com dezenas de descrições inteiras numa busca ampla.

    **Tensão real:** o trecho basta numa listagem de N eventos, mas trava o
    aprofundamento de UM evento ("me conta mais dessa festa"). Não é só aumentar o
    limite — isso reintroduz o peso morto que motivou o corte.

    **Correção desenhada (opções, decidir na implementação):**
    (a) tool MCP nova `detalhar_evento(id/url)` que devolve a descricao inteira de um
        evento só — separa "listar" de "aprofundar", mantém a busca enxuta; ou
    (b) parâmetro `descricao_completa: bool` (default false) em `buscar_eventos`,
        aplicado quando o resultado é 1 evento; ou
    (c) elevar o trecho e paginar. Preferência inicial: (a). Testar em
        `tests/test_mcp_server.py`.

