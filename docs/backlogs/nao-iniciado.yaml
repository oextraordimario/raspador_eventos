  resumo: "o organizador enfia a data no nome do evento ('Forró na Varanda | 28.07 | Varanda do Contexto'); a regra que remove isso vive em lib/formato.js e beneficia só o front — o agente que consulta pelo MCP continua recebendo o título sujo"
  data: 2026-07-27
