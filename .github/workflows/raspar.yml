# Cron da raspagem — NI-10, spec docs/specs/20260726_abrir-ao-publico §3 passo 2.
#
# Tira o humano da MAIOR PARTE da cadência: o atualizar.py deixa de depender
# de o autor lembrar de rodar — menos as duas coisas listadas abaixo, que só a
# máquina dele faz. Grava direto na base remota (Neon), como já fazia local.
#
# Por que GitHub Actions e não Cloud Run/Lambda: o processo leva 10-15 min e
# precisa de Python + Node ao mesmo tempo — é container, não function. (O
# Chromium também pesava nessa conta até 2026-07-28, quando o Shotgun saiu
# daqui; o argumento continua de pé pelo tempo de execução.) O runner ubuntu já
# traz os dois e, como o repo é PÚBLICO, os minutos são gratuitos e ilimitados.
# Comparativo das 7 opções e o plano B (Cloud Run Jobs) no anexo cron.md da spec.
#
# ATENÇÃO — duas coisas NÃO rodam aqui, e as duas são feitas na máquina do
# autor:
#     python src/pipeline/atualizar.py --rodada-local [--com-instagram]
#
#   1. Instagram inteiro. Desde 2026-09-19 a fonte é OPT-IN (--com-instagram):
#      é a única com custo por rodada (~$0,006/perfil no Monid) e a única que
#      depende de duas ferramentas externas, e a extração do flyer já não
#      rodava aqui porque o `claude -p` usa a ASSINATURA, que não existe em
#      CI. Nenhuma rodada automática raspa Instagram — ele entra quando o
#      autor pede. Para religar no cron: devolver o setup-node + o step do
#      Monid (git log deste arquivo) e acrescentar `--com-instagram
#      --sem-extracao-flyer` ao comando.
#   2. Shotgun (--sem-shotgun): o site entrega a listagem vazia para o runner
#      (0 eventos em 26, 27 e 28/07) e vai bem na máquina do autor, que raspou
#      65 eventos no mesmo dia. Decisão de 2026-07-28 (NI-58): não vale
#      investigar bloqueio nem pagar proxy residencial por ~65 eventos/semana
#      — a fonte pega carona na rodada local.
#      Consequência aceita: a agenda do Shotgun fica tão fresca quanto a
#      frequência com que a rodada local é executada.

name: raspar

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília. Fila do GitHub mais curta fora do pico
    # americano, e a base fica pronta antes de alguém acordar e perguntar o
    # que tem hoje. O cron do Actions é best effort — atraso de 10-30 min é
    # esperado e irrelevante para raspagem diária de vida noturna.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Duas rodadas simultâneas fariam UPSERT concorrente na mesma base. Não
# corrompe (a chave é <fonte>:<id_nativo>), mas desperdiça e embaralha o
# relatório de comparação com a rodada anterior.
concurrency:
  group: raspar
  cancel-in-progress: false

jobs:
  raspar:
    runs-on: ubuntu-latest
    # Teto de 6h no plano; a rodada real leva 10-15 min. 40 min corta um
    # travamento de rede sem cortar uma rodada lenta de verdade.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      # Sem Chromium aqui: o Playwright só era usado pelo Shotgun, que saiu do
      # cron (ver o cabeçalho). Isso corta ~2 min e ~400 MB de cada rodada.

      # Sem Node nem CLI do Monid aqui: existiam só para o Instagram, que saiu
      # do cron em 2026-09-19 (ver o cabeçalho). O secret MONID_KEY segue
      # guardado no repo para quando a fonte voltar.

      - name: Raspar
        env:
          EVENTOS_DB_URL: ${{ secrets.EVENTOS_DB_URL }}
          # NI-36: sinopse/nota/ano dos filmes (incremental, ~0 chamadas na
          # rodada normal). NI-37: pôster e flyer para o storage próprio.
          # Ausentes, os passos são pulados com aviso — não derrubam a rodada.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python src/pipeline/atualizar.py --sem-shotgun
